<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parameter Correlations</title>
<style>
  :root { --ink: #000; --paper: #fff; --rule: #000; --hair: #d9d9d9; --dim: #6b6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 28px 24px 40px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 20px; letter-spacing: -0.01em; }

  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px;
              padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding: 0; margin-bottom: 6px; }
  .range { display: flex; align-items: center; gap: 8px; }
  .range span { color: var(--dim); }
  select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink);
           border-radius: 0; padding: 6px 28px 6px 10px; appearance: none; cursor: pointer;
           background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                             linear-gradient(135deg, var(--ink) 50%, transparent 50%);
           background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
           background-size: 5px 5px; background-repeat: no-repeat; }
  select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 0; }
  label.check input { width: 16px; height: 16px; margin: 0; accent-color: #000; }
  button { font: inherit; color: var(--paper); background: var(--ink); border: 1px solid var(--ink);
           border-radius: 0; padding: 7px 16px; cursor: pointer; margin-left: auto; }
  button:hover { background: var(--paper); color: var(--ink); }

  .search { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .search input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink);
                  border-radius: 0; padding: 7px 10px; width: 320px; max-width: 100%; }
  .search input::placeholder { color: var(--dim); }
  .search input::-webkit-search-cancel-button { filter: grayscale(1) brightness(0); cursor: pointer; }
  .search span { color: var(--dim); font-size: 12px; }
  .wrap { overflow: auto; max-height: calc(100vh - 240px); margin-top: 12px; border: 1px solid var(--ink); }
  td.empty { color: var(--dim); text-align: left; padding: 16px 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--paper); z-index: 2; font-weight: 600;
             text-align: right; border-bottom: 1px solid var(--ink); white-space: normal;
             vertical-align: bottom; min-width: 82px; font-size: 12px; }
  th.param, td.param { text-align: left; position: sticky; left: 0; background: var(--paper);
                       min-width: 280px; border-right: 1px solid var(--ink); }
  thead th.param { z-index: 3; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  td.idx { color: var(--dim); width: 36px; text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; }
  tbody tr:hover td { background: #f2f2f2; }

  @media (max-width: 700px) {
    main { padding: 18px 16px 28px; }
    .controls { gap: 16px; }
    button { margin-left: 0; }
    th.param, td.param { min-width: 140px; max-width: 160px; white-space: normal; }
    .search input { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>Parameter → next-year return correlation</h1>

  <div class="controls">
    <fieldset>
      <legend>Parameter years</legend>
      <div class="range">
        <select id="pFrom" aria-label="Parameter years from"></select><span>to</span>
        <select id="pTo" aria-label="Parameter years to"></select>
      </div>
    </fieldset>
    <fieldset>
      <legend>Return years</legend>
      <div class="range">
        <select id="rFrom" aria-label="Return years from"></select><span>to</span>
        <select id="rTo" aria-label="Return years to"></select>
      </div>
    </fieldset>
    <label class="check"><input type="checkbox" id="exSector"> Exclude Sector funds</label>
    <button id="export" type="button">Export to Excel</button>
  </div>

  <div class="search">
    <input id="search" type="search" placeholder="Search parameters" aria-label="Search parameters" autocomplete="off">
    <span id="count"></span>
  </div>

  <div class="wrap"><table id="grid"></table></div>
</main>

<script src="data.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";
  var D = window.CORR_DATA;
  var P = D.parameters.length;
  var years = D.parameterYears;
  var $ = function (id) { return document.getElementById(id); };

  // Pearson correlation over pairwise complete observations (two-pass, as numpy/pandas).
  function pearson(rows, k) {
    var n = 0, mx = 0, my = 0, i, x, y;
    for (i = 0; i < rows.length; i++) {
      x = rows[i][3 + k]; y = rows[i][2];
      if (x === null || y === null) continue;
      n++; mx += x; my += y;
    }
    if (n < 2) return null;
    mx /= n; my /= n;
    var sxx = 0, syy = 0, sxy = 0, dx, dy;
    for (i = 0; i < rows.length; i++) {
      x = rows[i][3 + k]; y = rows[i][2];
      if (x === null || y === null) continue;
      dx = x - mx; dy = y - my;
      sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
    }
    if (sxx === 0 || syy === 0) return null;
    var r = sxy / Math.sqrt(sxx * syy);
    return Math.max(-1, Math.min(1, r));
  }

  function compute(from, to, exSector) {
    var groups = ["All Funds"], members = [[]], col = {};
    D.groups.forEach(function (g, i) {
      if (exSector && i === D.sectorGroup) return;
      col[i] = groups.length; groups.push(g); members.push([]);
    });
    D.rows.forEach(function (row) {
      if (row[1] < from || row[1] > to) return;
      if (exSector && row[0] === D.sectorGroup) return;
      members[0].push(row); members[col[row[0]]].push(row);
    });
    var values = D.parameters.map(function (_, k) {
      return members.map(function (rows) { return pearson(rows, k); });
    });
    return { groups: groups, values: values };
  }

  function returnLabel(year) { return D.returnLabels[String(year + 1)] || String(year + 1); }

  function fill(select, list, label) {
    select.innerHTML = list.map(function (y) {
      return '<option value="' + y + '">' + label(y) + "</option>";
    }).join("");
  }
  fill($("pFrom"), years, String); fill($("pTo"), years, String);
  fill($("rFrom"), years, returnLabel); fill($("rTo"), years, returnLabel);

  // Return years are always the year after the parameter years; the two pickers move together.
  function set(from, to) {
    if (from > to) { var t = from; from = to; to = t; }
    $("pFrom").value = $("rFrom").value = from;
    $("pTo").value = $("rTo").value = to;
    render();
  }
  ["pFrom", "rFrom"].forEach(function (id) {
    $(id).addEventListener("change", function () { set(+this.value, +$("pTo").value); });
  });
  ["pTo", "rTo"].forEach(function (id) {
    $(id).addEventListener("change", function () { set(+$("pFrom").value, +this.value); });
  });
  $("exSector").addEventListener("change", render);
  $("search").addEventListener("input", draw);

  var current = null;
  function fmt(v) { return v === null ? "—" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(2); }

  function render() {
    var from = +$("pFrom").value, to = +$("pTo").value, ex = $("exSector").checked;
    current = { from: from, to: to, ex: ex, result: compute(from, to, ex) };
    draw();
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  // Draws the computed values; the search box only filters rows (numbers keep their Sr No).
  function draw() {
    var g = current.result.groups;
    var query = $("search").value.trim().toLowerCase();
    var shown = 0;
    var html = "<thead><tr><th></th><th class=\"param\">Parameter</th>" +
      g.map(function (name) { return "<th>" + name + "</th>"; }).join("") + "</tr></thead><tbody>";
    D.parameters.forEach(function (name, k) {
      if (query && name.toLowerCase().indexOf(query) === -1) return;
      shown++;
      html += "<tr><td class=\"idx\">" + (k + 1) + "</td><td class=\"param\">" + escapeHtml(name) + "</td>" +
        current.result.values[k].map(function (v) { return "<td class=\"num\">" + fmt(v) + "</td>"; }).join("") +
        "</tr>";
    });
    if (!shown) {
      html += "<tr><td></td><td class=\"empty\" colspan=\"" + (g.length + 1) + "\">No parameter matches \u201c" +
        escapeHtml($("search").value.trim()) + "\u201d.</td></tr>";
    }
    $("grid").innerHTML = html + "</tbody>";
    $("count").textContent = query ? shown + " of " + D.parameters.length + " parameters" : "";
  }

  $("export").addEventListener("click", function () {
    var c = current, g = c.result.groups;
    var period = "Parameter years " + c.from + "–" + c.to + " vs return years " +
      returnLabel(c.from) + "–" + returnLabel(c.to);
    var aoa = [[period + (c.ex ? ", excluding Sector Funds" : "")], [],
               ["Sr No", "Parameter"].concat(g)];
    D.parameters.forEach(function (name, k) {
      aoa.push([k + 1, name].concat(c.result.values[k].map(function (v) { return v === null ? "" : v; })));
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    for (var r = 3; r < aoa.length; r++) {
      for (var j = 2; j < aoa[r].length; j++) {
        var cell = ws[XLSX.utils.encode_cell({ r: r, c: j })];
        if (cell && cell.t === "n") cell.z = "0.00";
      }
    }
    ws["!cols"] = [{ wch: 6 }, { wch: 48 }].concat(g.map(function () { return { wch: 14 }; }));
    ws["!freeze"] = { xSplit: 2, ySplit: 3 };
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (c.from + "-" + String(c.to).slice(2) + (c.ex ? " ex Sector" : "")));
    XLSX.writeFile(wb, "Correlation_" + c.from + "-" + c.to + (c.ex ? "_ex_Sector" : "") + ".xlsx");
  });

  set(years[0], years[years.length - 1]);
})();
</script>
</body>
</html>
